# Additive benchmark override: publish the TEI sidecars on loopback only, so the
# in-process benchmark runner (`make benchmark-live`) can reach the same inference
# servers the containerized stack uses. The base file is NOT edited; merge the two:
#
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.benchmark.yml \
#     up -d pattern-tei-embed pattern-tei-rerank
#
# The published ports are bound to 127.0.0.1 on purpose: a benchmark must never expose
# the unauthenticated sidecars beyond the workstation. Override the host ports with
# BENCH_EMBED_PORT / BENCH_RERANK_PORT (the runner's defaults live in the Makefile:
# BENCH_EMBED_URL / BENCH_RERANK_URL point at 127.0.0.1:18081 / 127.0.0.1:18082).
services:
  # A benchmark stack must never warm, populate or invalidate the persistent
  # embedding-index volume: the arms measure the cold embed path, and the
  # in-process harness pins the same value (tests/benchmark/harness/config.py
  # ::disable_embedding_cache). Merged over the base file this only bites if the
  # MCP service is started under this override — `make benchmark-sidecars-up`
  # starts the sidecars alone.
  architecture-pattern-mcp:
    environment:
      - EMBEDDING_CACHE=0

  pattern-tei-embed:
    ports:
      - "127.0.0.1:${BENCH_EMBED_PORT:-18081}:8080"    # container port is the base file's 8080

  pattern-tei-rerank:
    ports:
      - "127.0.0.1:${BENCH_RERANK_PORT:-18082}:8080"
