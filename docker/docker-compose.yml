# Development Compose for local use with `make docker-up`.
#
# Dev variant (distinct from the systemd/production stack at
# systemd/docker-compose.yml and /etc/architecture-pattern-mcp/):
#   - Uses service DNS (pattern-tei / pattern-tei-rerank) — no network_mode needed.
#   - Config is read from ../config (mounted at /app/config).
#   - TEI sidecars use unique container names (architecture-pattern-tei*) so the dev
#     stack can run concurrently with the systemd stack and/or the shared
#     tei-infra stack without container-name conflicts.
#   - Default host port is 8060 (systemd uses 8050) so dev and prod can coexist.
#
# Usage:
#   make docker-up   # or: docker compose -f docker/docker-compose.yml up -d --build

name: architecture-pattern-mcp-dev

services:
  architecture-pattern-mcp:
    image: ${MCP_IMAGE:-architecture-pattern-mcp:latest}
    container_name: architecture-pattern-mcp
    environment:
      - CONFIG_PATH=/app/config/config.json
      - GENERATOR_PROVIDER=minimax
      - GENERATOR_MODEL=minimax/MiniMax-M2.7
      - GENERATOR_BASE_URL=https://api.minimax.io/v1
      - GENERATOR_API_KEY=${MINIMAXAI_API_KEY}
      - GENERATOR_TEMPERATURE=0.1
      - GENERATOR_TOP_P=1.0
      - GENERATOR_TOP_K=20

      - EMBEDDER_PROVIDER=tei
      - EMBEDDER_BASE_URL=http://pattern-tei-embed:8080/v1
      - EMBEDDER_BATCH_SIZE=8
      - EMBEDDER_API_KEY=not-needed

      - PATTERN_DIRECTORY=./pattern

      - RETRIEVAL_BM25_TOP_K=20
      - RETRIEVAL_DENSE_TOP_K=20
      # Stage-1 fusion leg weights (dense + BM25 must sum to 1.0; a startup
      # warning fires if either is < 0.05). Overridable via .env or shell.
      - RETRIEVAL_DENSE_WEIGHT=${RETRIEVAL_DENSE_WEIGHT:-0.7}
      - RETRIEVAL_BM25_WEIGHT=${RETRIEVAL_BM25_WEIGHT:-0.3}
      - RETRIEVAL_TOP_K_PATTERNS=5
      # Slug-cut strategy is locked to rank_fusion (Vespa-style RR blend).
      # The reported fusion_score lies in [0, 2/60] ≈ [0, 0.033];
      # top-of-pool blends sit around 0.030-0.033, so 0.015 gates only
      # long-tail candidates (consensus rises through rerank_top_n).
      - RETRIEVAL_MIN_FUSION_SCORE=0.015
      - RETRIEVAL_RERANK_TOP_N=10
      - RETRIEVAL_USE_LEAN_WIRE_SCHEMA=false
      - RETRIEVAL_STYLE_SCORE_THRESHOLD=50.0
      - RETRIEVAL_ANALYSIS_BLEND_WEIGHT=0.7
      - RETRIEVAL_FUSION_BLEND_WEIGHT=0.3
      - RETRIEVAL_WEIGHT_SMOOTHING_ALPHA=0.7
      - RETRIEVAL_VERBOSE_TIMING=false

      - RERANKER_BASE_URL=http://pattern-tei-rerank:8080
      - RERANKER_TIMEOUT=30

      # Server-side reasoning MCPs (Plan v5) — embedded in the image at
      # build time; defaults below. Override commands as JSON lists to point
      # elsewhere (e.g. npx) or set REASONING_ENABLED=false to opt out.
      - REASONING_ENABLED=true
      - REASONING_SPAWN_TIMEOUT_SECONDS=10
      - REASONING_STEP_TIMEOUT_SECONDS=20
      - REASONING_MAX_TOTAL_STEPS=8
      - REASONING_QUIET_STDERR=true
      - REASONING_FAIL_FAST=true

      - TASKS_HEARTBEAT_ENABLED=true
      - TASKS_HEARTBEAT_INTERVAL_SECONDS=30
      - TRANSPORT=streamable-http
      - HOST=0.0.0.0
      - PORT=8050
      - LOGGING_LEVEL=INFO
      - LOGGING_FORMAT=json
      - LITELLM_LOG_LEVEL=WARNING

    depends_on:
      pattern-tei-embed:
        condition: service_healthy
      pattern-tei-rerank:
        condition: service_healthy
    ports:
      - "${MCP_HOST_PORT:-8060}:8050"
    volumes:
      - ../config:/app/config
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-m", "src.main", "--health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  pattern-tei-embed:
    image: ${TEI_IMAGE:-pattern-tei-embed:latest}
    container_name: architecture-pattern-tei-embed
    restart: unless-stopped
    # No ports published — internal only (reached by MCP via Docker DNS)
    environment:
      - HF_HUB_OFFLINE=1
      - HUGGINGFACE_HUB_CACHE=/data
      # TEI tunables — clap env fallbacks. Compose overrides Dockerfile ENV.
      # Invariant: EMBEDDER_BATCH_SIZE (client) ≤ MAX_CLIENT_BATCH_SIZE ≤ MAX_CONCURRENT_REQUESTS.
      - MAX_CONCURRENT_REQUESTS=${TEI_MAX_CONCURRENT_REQUESTS:-32}
      - MAX_BATCH_TOKENS=${TEI_MAX_BATCH_TOKENS:-8192}
      - MAX_CLIENT_BATCH_SIZE=${TEI_MAX_CLIENT_BATCH_SIZE:-32}
      - AUTO_TRUNCATE=${TEI_AUTO_TRUNCATE:-true}
      - PROMETHEUS_PORT=${TEI_PROMETHEUS_PORT:-0}
      - HOSTNAME=${TEI_HOSTNAME:-0.0.0.0}
      - PORT=${TEI_PORT:-8080}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  pattern-tei-rerank:
    image: ${TEI_RERANK_IMAGE:-pattern-tei-rerank:latest}
    container_name: architecture-pattern-tei-rerank
    restart: unless-stopped
    # No ports published — internal only (reached by MCP via Docker DNS)
    environment:
      - HF_HUB_OFFLINE=1
      - HUGGINGFACE_HUB_CACHE=/data
      # TEI reranker tunables — clap env fallbacks. Compose overrides Dockerfile ENV.
      # Invariant: max_batch_size (client, default 48) ≤ min(MAX_CLIENT_BATCH_SIZE, MAX_CONCURRENT_REQUESTS).
      # NOTE: PORT here must match the RERANKER_BASE_URL used by the MCP server
      # (compose env or config.json default: http://pattern-tei-rerank:8080).
      # If you change PORT, update those URLs accordingly.
      - MAX_CONCURRENT_REQUESTS=${TEI_RERANK_MAX_CONCURRENT_REQUESTS:-64}
      - MAX_BATCH_TOKENS=${TEI_RERANK_MAX_BATCH_TOKENS:-16384}
      - MAX_CLIENT_BATCH_SIZE=${TEI_RERANK_MAX_CLIENT_BATCH_SIZE:-48}
      - AUTO_TRUNCATE=${TEI_RERANK_AUTO_TRUNCATE:-true}
      - PROMETHEUS_PORT=${TEI_RERANK_PROMETHEUS_PORT:-0}
      - HOSTNAME=${TEI_RERANK_HOSTNAME:-0.0.0.0}
      - PORT=${TEI_RERANK_PORT:-8080}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
