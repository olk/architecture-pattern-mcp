# Local hooks only: run tools through uv so the project venv (fastmcp,
# llama-index, pydantic, faiss stubs) is visible. mirrors-mypy would run in an
# isolated env and flood import-untyped errors. CI remains authoritative
# (covers --no-verify bypass).
#
# Hook order is fail-fast by cost and scope — pre-commit stops at the first
# failing hook, so cheap, diff-scoped checks run before whole-tree scans:
#   1. ruff   — ms-fast; parse errors/undefined names never reach slow mypy
#   2. mypy   — semantic correctness of the diff before hygiene scans
#   3. vulture — needs whole-tree name usage, cannot run per-diff file
#   4. deptry  — packaging hygiene; import usage depends on the final code
#               state (dead-code removal can orphan a dependency), so it must
#               see the tree only after code-level checks passed
repos:
  - repo: local
    hooks:
      # 1. make lint — on changed .py files repo-wide; --force-exclude keeps
      #    whitelist.py (extend-exclude in pyproject) out when pre-commit
      #    passes it explicitly.
      - id: ruff-check
        name: ruff check (make lint)
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]

      # 2. make static-typing
      - id: mypy-strict
        name: mypy --strict (changed src/ files)
        entry: uv run mypy --strict
        language: system
        types: [python]
        files: ^src/
        require_serial: true

      # 3. make deadcode — whole-tree name analysis; per-diff runs would emit
      #    false positives for cross-module references, hence pass_filenames.
      #    Decorator list mirrors VULTURE_IGNORE_DECORATORS in the Makefile.
      - id: vulture-deadcode
        name: vulture dead-code scan (make deadcode)
        entry: uv run vulture src examples whitelist.py --min-confidence 80 --ignore-decorators '@step,@field_validator,@model_validator,@*.resource,@*.prompt'
        language: system
        pass_filenames: false
        files: ^(src|examples)/.*\.py$|^whitelist\.py$

      # 4. make depcheck — imports vs pyproject metadata; also re-runs when
      #    the dependency declaration itself changes.
      - id: deptry-depcheck
        name: deptry dependency-hygiene scan (make depcheck)
        entry: uv run deptry .
        language: system
        pass_filenames: false
        files: ^(src|examples)/.*\.py$|^pyproject\.toml$
