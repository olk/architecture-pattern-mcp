name: Nightly Verification Canaries

# L10 TCB canaries (testing-strategies §3.10, nagini plan §6.3 / fizzbee plan
# §6.4): the verifiers and tester toolchains are part of the trusted computing
# base; a garden mutant that survives a dependency bump BLOCKS the bump until
# triaged. Advisory jobs are marked continue-on-error — findings are leads
# that must be triaged, not silent green.

on:
  schedule:
    - cron: "0 3 * * *" # nightly, 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  bug-gardens:
    name: TCB canary — bug gardens + oracle suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Executable oracles (canary, PBT, trace replay, conformance, DST)
        run: uv run pytest tests/verification/ -v

      - name: Planted-bug garden kill check
        run: uv run pytest tests/verification/test_bug_garden.py -v

      - name: L9 offline invariants vacuity guard
        run: uv run pytest tests/eval/ -v

      - name: Property-ID ledger consistency
        run: make verify-ledger

      - name: NL-Doc cross-consistency (mechanical subset)
        run: make verify-cross-consistency

      - name: Import inventory drift
        run: make verify-import-inventory

      - name: Perf smoke canary (coarse budgets)
        run: uv run pytest tests/verification/test_perf_smoke.py -m perf -v
        env:
          RUN_PERF: "1"

  mutmut-sweep:
    name: TCB canary — mutmut over Tier A/B/C (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
      - run: uv sync
      - name: mutmut incremental sweep
        run: make test-mutations

  verify-nagini:
    name: L5 — Nagini over NAGINI_FILES (opt-in toolchain)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
      - run: uv sync
      - name: Contract coverage report
        run: make verify-coverage
      - name: Nagini verification
        run: make verify-nagini
        env:
          RUN_VERIFY: "1"

  verify-fizz:
    name: L4 — FizzBee exhaustive checks (opt-in toolchain)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
      - run: uv sync
      - name: Install fizzbee
        run: |
          git clone --depth 1 https://github.com/fizzbee-io/fizzbee.git /tmp/fizzbee
          echo /tmp/fizzbee || true
        # Toolchain installation is finalized when provisioned
        # (docs/phase-0-decisions.md); until then this job surfaces the gap.
      - name: Exhaustive model checks
        run: make verify-fizz
        env:
          RUN_VERIFY: "1"

  deps-audit:
    name: L7 — pip-audit vulnerability scan (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
      - run: uv sync
      - name: Vulnerability scan (strict within the advisory job)
        run: make verify-deps-audit
        env:
          STRICT: "1"
