# FR-1: The system SHALL define the project name as architecture-pattern-mcp
# FR-2: The system SHALL define the project version as 1.0.16
# FR-3: The system SHALL require Python version 3.12 or higher
# FR-4: The system SHALL depend on fastmcp version 4.0.2 or higher for MCP protocol support
# FR-5: The system SHALL depend on llama-index-core and llama-index-llms-litellm for multi-provider LLM access
# FR-6: The system SHALL depend on pydantic version 2.12 or higher for data validation
# FR-7: The system SHALL depend on python-dotenv version 1.0.0 or higher for environment variable management
# FR-200: The system SHALL depend on sentence-transformers>=3.0 and faiss-cpu>=1.14.3
# IC-1: Python version SHALL be 3.12 or higher
# IC-2: fastmcp version SHALL be 4.0.2 or higher
# IC-3: llama-index-core and llama-index-llms-litellm version SHALL be as specified
# IC-4: pydantic version SHALL be 2.12 or higher
# IC-5: python-dotenv version SHALL be 1.0.0 or higher
# IC-34: sentence-transformers>=3.0 and faiss-cpu>=1.14.3
# IC-41: The system SHALL use hatchling as the build backend
# IC-42: The system SHALL provide entry points `python -m src.server` and `architecture-pattern-mcp`

[project]
name = "architecture-pattern-mcp"
version = "1.1.0"
requires-python = ">=3.12"
description = "MCP Architect Server providing comprehensive architectural expertise through lightweight pipeline coordinator and domain-specific tools"
license = { text = "MIT" }
authors = [
    { name = "Oliver Kowalke", email = "oliver.kowalke@gmail.com" }
]
keywords = ["mcp", "architecture", "design", "pattern", "fastmcp", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# FR-4, IC-2: MCP protocol support via FastMCP (factmcp)
# FR-5, IC-3: Multi-provider LLM access via LlamaIndex LiteLLM integration
# FR-6, IC-4: Data validation via Pydantic v2
# FR-7, IC-5: Environment variable management via python-dotenv
# FR-200, IC-34: Vector similarity search via faiss-cpu and LiteLLMEmbedding
dependencies = [
    "fastmcp>=4.0.2",
    "llama-index-core>=0.14.23,<0.15",
    "llama-index-llms-litellm>=0.7.1,<0.8",
    "llama-index-embeddings-litellm>=0.5.0,<0.6",
    "llama-index-retrievers-bm25>=0.7.1,<0.8",
    "pydantic>=2.12.0",
    "python-dotenv>=1.0.0",
    "llama-index-postprocessor-tei-rerank>=0.5.0,<0.6",
    "faiss-cpu>=1.14.3",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "click>=8.0.0",
    "numpy>=1.26.0",
    "llama-index-vector-stores-faiss>=0.7.0",
]

[build-system]
requires = ["hatchling>=1.0.0"]
build-backend = "hatchling.build"

[project.optional-dependencies]
docs = [
    "sphinx>=7.2.0",
    "sphinx-autoapi>=3.0.0",
    "pydata-sphinx-theme>=0.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.0.0",
    "ruff>=0.2.0",
    "mypy>=2.3.1",
    "pre-commit>=3.6.0",
    "vulture>=2.14",
    "deptry>=0.23.0",
    "simloom>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/architecture-pattern/architecture-pattern-mcp"
Documentation = "https://github.com/architecture-pattern/architecture-pattern-mcp.readthedocs.io"
Repository = "https://github.com/architecture-pattern/architecture-pattern-mcp"
Issues = "https://github.com/architecture-pattern/architecture-pattern-mcp/issues"

# FR-245: Entry point for the MCP server
# IC-42: python -m src.server command and architecture-pattern-mcp command
[project.scripts]
architecture-pattern-mcp = "src.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src", "nagini_contracts"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
]

[tool.ruff]
line-length = 120
target-version = "py312"
# Vulture whitelist contains intentional bare-name references (see whitelist.py).
extend-exclude = ["whitelist.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "DTZ", "T10", "ISC", "PIE", "PT", "RET", "SIM", "ARG", "PL", "TRY", "RUF"]
ignore = [
    # Pre-existing violations — resolve in a dedicated cleanup PR
    "TRY003",
    "TRY301",
    "TRY300",
    "TRY400",
    "E501",
    "E741",
    "E401",
    "E402",
    "PLC0415",
    "PLR2004",
    "PLR0913",
    "PLR0917",
    "ARG001",
    "ARG002",
    "ARG005",
    "W293",
    "W291",
    "W292",
    "I001",
    "RUF012",
    "RUF013",
    "RUF022",
    "RUF002",
    "RUF100",
    "UP035",
    "UP036",
    "UP042",
    "DTZ001",
    "DTZ003",
    "PT011",
    "PT015",
    "PT017",
    "PT018",
    "SIM102",
    "SIM103",
    "SIM108",
    "SIM110",
    "SIM117",
    "SIM118",
    "RET504",
    "PLW0108",
    "B007",
    "B011",
    "B017",
    "B904",
]

[tool.ruff.lint.per-file-ignores]
# Nagini-verified cores (L5): the contract idiom requires quantifier lambdas
# inside loop bodies (B023), list concatenation instead of starred literals
# (RUF005), and classic TypeVar generics in the contract stub — PEP 695 is
# not parseable by Nagini's bundled mypy (UP047).
"src/text_validation_core.py" = ["B023", "RUF005"]
"src/design_normalization_core.py" = ["B023", "RUF005"]
"nagini_contracts/contracts.pyi" = ["UP047"]

# L3 planted-bug garden: mutants deliberately encode the bug classes the
# oracles must catch (zip-without-strict and manual loop indices ARE the
# mutations; "fixing" them would delete the bugs the garden exists to plant).
"tests/verification/gardens/*" = ["B905", "SIM113"]
# L9 structural invariant checker: one branch per invariant family (INV-1..7)
# is the point of the function — splitting it would hide the invariant set.
"tests/eval/invariants.py" = ["PLR0912"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
files = ["src"]
explicit_package_bases = true
# Policy: NO mypy plugins (e.g. pydantic.mypy) — zuban LSP (Rust) cannot run
# mypy plugins and would diverge from CI. Use PEP-681-compatible style instead
# (Field(default=...) keyword form, annotated default_factory functions).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "perf: performance benchmarks, opt-in via RUN_PERF=1",
    "llm: live LLM benchmarks, opt-in via ARCH_BENCH_LLM=1 (requires config + endpoint)",
]

[tool.deptry]
extend_exclude = ["verify"]
# "verify_coverage" = scripts/verify_coverage.py (NAGINI_FILES, shared by the
# L5 coverage report and the L8 cross-consistency gate) — a repo-local module,
# not a package dependency.
known_first_party = ["src", "nagini_contracts", "verify_coverage"]
# Treat the docs extras (sphinx toolchain) as build-time-only, not runtime deps.
optional_dependencies_dev_groups = ["docs"]

[tool.deptry.package_module_name_map]
# Import-name to package-name mappings deptry cannot infer automatically.
"python-dotenv" = ["dotenv"]
"faiss-cpu" = ["faiss"]
"PyStemmer" = ["Stemmer"]
"llama-index-core" = ["llama_index"]
# Docs toolchain (optional_dependencies_dev_groups = ["docs"]): make the
# package->module mapping explicit to suppress deptry's "Assuming the
# corresponding module name" notices.
"sphinx" = ["sphinx"]
"sphinx-autoapi" = ["sphinx_autoapi"]
"pydata-sphinx-theme" = ["pydata_sphinx_theme"]

[tool.deptry.per_rule_ignores]
# litellm (src/agent.py) and workflows (src/pipeline.py) are imported directly
# but provided transitively via llama-index-llms-litellm and llama-index-core
# (which vendors llama-index-workflows). mcp (src/server.py, src/tools/*) is
# imported directly but provided transitively via fastmcp. Ignored under both
# DEP001 and DEP003.
DEP001 = ["litellm", "workflows", "mcp", "mutmut"]
DEP003 = ["litellm", "workflows", "mcp"]

# L3 mutation testing (testing-strategies.md §3.4, nagini plan §5.2):
# mutmut audits the oracles themselves — the answer to same-model circularity
# (68% of AI test suites validate bugs instead of catching them). Scope is the
# Tier A/B/C modules; run via `make test-mutations` (manual/nightly gate).
# Caveat (mutmut docs): the mypy-based mutant filter can hide valid mutants —
# the planted-bug garden (tests/verification/gardens/) stays the vacuity
# authority; filter survivor counts are a hint, never a verdict.
[tool.mutmut]
# Mutate the whole src/ tree (mutants/src must be a COMPLETE package for
# imports to resolve during mutmut's pytest runs) and restrict mutation to
# the Tier A/B/C modules via do_not_mutate — everything else is copied
# unmutated (nagini plan §5.2 scope: the critical 5-10%, never the tree).
source_paths = ["src/"]
# mutmut executes pytest from mutants/ — the shim (verify/) and the contract
# stub package (nagini_contracts/, imported by the verified cores) must be
# present there (copied unmutated).
also_copy = ["verify/", "nagini_contracts/"]
# In-process shim: mutmut 3.7 asserts trampoline-hit module names never
# start with "src." (an src-LAYOUT convention guard) — this repo's import
# package IS `src`, so the stats run asserts on every legitimate hit. The
# plugin (copied into mutants/ via also_copy) relaxes exactly that assert;
# regular pytest runs never import it.
pytest_add_cli_args = ["-p", "verify.mutmut.mutmut_compat", "--hypothesis-profile=mutmut"]
do_not_mutate = [
    "src/agent.py",
    "src/config.py",
    "src/errors.py",
    "src/main.py",
    "src/__main__.py",
    "src/pipeline.py",
    "src/server.py",
    "src/mcp_prompts/*",
    "src/patterns/*",
    "src/prompts/*",
    "src/reasoning/*",
    "src/resources/*",
    "src/schemas/*",
    "src/tools/analyze.py",
    "src/tools/cancel_architecture_design.py",
    "src/tools/design.py",
    "src/tools/evaluate.py",
    "src/tools/generate.py",
    "src/tools/get_architecture_design_status.py",
    "src/tools/__init__.py",
    "src/tools/patterns.py",
    "src/tools/submit_architecture_design.py",
    "src/tools/_adapters.py",
]
pytest_add_cli_args_test_selection = [
    "tests/unit/test_text_validation.py",
    "tests/unit/test_normalization.py",
    "tests/unit/test_validation.py",
    "tests/unit/test_jobs.py",
    "tests/unit/test_config_expansion.py",
    "tests/verification",
]
