# FR-1: The system SHALL define the project name as architecture-pattern-mcp
# FR-2: The system SHALL define the project version as 1.0.16
# FR-3: The system SHALL require Python version 3.12 or higher
# FR-4: The system SHALL depend on fastmcp version 4.0.2 or higher for MCP protocol support
# FR-5: The system SHALL depend on llama-index-core and llama-index-llms-litellm for multi-provider LLM access
# FR-6: The system SHALL depend on pydantic version 2.12 or higher for data validation
# FR-7: The system SHALL depend on python-dotenv version 1.0.0 or higher for environment variable management
# FR-200: The system SHALL depend on sentence-transformers>=3.0 and faiss-cpu>=1.14.3
# IC-1: Python version SHALL be 3.12 or higher
# IC-2: fastmcp version SHALL be 4.0.2 or higher
# IC-3: llama-index-core and llama-index-llms-litellm version SHALL be as specified
# IC-4: pydantic version SHALL be 2.12 or higher
# IC-5: python-dotenv version SHALL be 1.0.0 or higher
# IC-34: sentence-transformers>=3.0 and faiss-cpu>=1.14.3
# IC-41: The system SHALL use hatchling as the build backend
# IC-42: The system SHALL provide entry points `python -m src.server` and `architecture-pattern-mcp`

[project]
name = "architecture-pattern-mcp"
version = "1.1.1"
requires-python = ">=3.12"
description = "MCP Architect Server providing comprehensive architectural expertise through lightweight pipeline coordinator and domain-specific tools"
license = { text = "MIT" }
authors = [
    { name = "Oliver Kowalke", email = "oliver.kowalke@gmail.com" }
]
keywords = ["mcp", "architecture", "design", "pattern", "fastmcp", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# FR-4, IC-2: MCP protocol support via FastMCP (factmcp)
# FR-5, IC-3: Multi-provider LLM access via LlamaIndex LiteLLM integration
# FR-6, IC-4: Data validation via Pydantic v2
# FR-7, IC-5: Environment variable management via python-dotenv
# FR-200, IC-34: Vector similarity search via faiss-cpu and LiteLLMEmbedding
dependencies = [
    "fastmcp>=4.0.2",
    "llama-index-core>=0.14.23,<0.15",
    "llama-index-llms-litellm>=0.7.1,<0.8",
    "llama-index-embeddings-litellm>=0.5.0,<0.6",
    "llama-index-retrievers-bm25>=0.7.1,<0.8",
    "pydantic>=2.12.0",
    "python-dotenv>=1.0.0",
    "llama-index-postprocessor-tei-rerank>=0.5.0,<0.6",
    "faiss-cpu>=1.14.3",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "click>=8.0.0",
    "numpy>=1.26.0",
    "llama-index-vector-stores-faiss>=0.7.0",
]

[build-system]
requires = ["hatchling>=1.0.0"]
build-backend = "hatchling.build"

[project.optional-dependencies]
docs = [
    "sphinx>=7.2.0",
    "sphinx-autoapi>=3.0.0",
    "pydata-sphinx-theme>=0.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    # L2 PBT layer (testing-strategies.md §3.3): the crosshair extra is the
    # documented "weak but useful peer" backend — same properties, second
    # engine, advisory only. Floor 6.100 keeps the modern st.characters
    # API (categories=/exclude_categories=) and profiles semantics stable.
    "hypothesis[crosshair]>=6.100,<7",
    "ruff>=0.2.0",
    "mypy>=2.3.1",
    "pre-commit>=3.6.0",
    "vulture>=2.14",
    "deptry>=0.23.0",
    "simloom>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/architecture-pattern/architecture-pattern-mcp"
Documentation = "https://github.com/architecture-pattern/architecture-pattern-mcp.readthedocs.io"
Repository = "https://github.com/architecture-pattern/architecture-pattern-mcp"
Issues = "https://github.com/architecture-pattern/architecture-pattern-mcp/issues"

# FR-245: Entry point for the MCP server
# IC-42: python -m src.server command and architecture-pattern-mcp command
[project.scripts]
architecture-pattern-mcp = "src.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
]

[tool.ruff]
line-length = 120
target-version = "py312"
# Vulture whitelist contains intentional bare-name references (see whitelist.py).
extend-exclude = ["whitelist.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "DTZ", "T10", "ISC", "PIE", "PT", "RET", "SIM", "ARG", "PL", "TRY", "RUF"]
ignore = [
    # Pre-existing violations — resolve in a dedicated cleanup PR
    "TRY003",
    "TRY301",
    "TRY300",
    "TRY400",
    "E501",
    "E741",
    "E401",
    "E402",
    "PLC0415",
    "PLR2004",
    "PLR0913",
    "PLR0917",
    "ARG001",
    "ARG002",
    "ARG005",
    "W293",
    "W291",
    "W292",
    "I001",
    "RUF012",
    "RUF013",
    "RUF022",
    "RUF002",
    "RUF100",
    "UP035",
    "UP036",
    "UP042",
    "DTZ001",
    "DTZ003",
    "PT011",
    "PT015",
    "PT017",
    "PT018",
    "SIM102",
    "SIM103",
    "SIM108",
    "SIM110",
    "SIM117",
    "SIM118",
    "RET504",
    "PLW0108",
    "B007",
    "B011",
    "B017",
    "B904",
]

[tool.ruff.lint.per-file-ignores]
# L3 planted-bug garden: mutants deliberately encode the bug classes the
# oracles must catch (zip-without-strict and manual loop indices ARE the
# mutations; "fixing" them would delete the bugs the garden exists to plant).
"tests/verification/gardens/*" = ["B905", "SIM113"]
# L9 structural invariant checker: one branch per invariant family (INV-1..7)
# is the point of the function — splitting it would hide the invariant set.
"tests/eval/invariants.py" = ["PLR0912"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
files = ["src"]
explicit_package_bases = true
# Policy: NO mypy plugins (e.g. pydantic.mypy) — zuban LSP (Rust) cannot run
# mypy plugins and would diverge from CI. Use PEP-681-compatible style instead
# (Field(default=...) keyword form, annotated default_factory functions).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "perf: performance benchmarks, opt-in via RUN_PERF=1",
    "llm: live LLM benchmarks, opt-in via ARCH_BENCH_LLM=1 (requires config + endpoint)",
]

[tool.deptry]
extend_exclude = ["verify"]
# "verify_coverage" was scripts/verify_coverage.py (deleted with the L5
# verification layer) — no repo-local first-party imports remain.
known_first_party = ["src"]
# Treat the docs extras (sphinx toolchain) as build-time-only, not runtime deps.
optional_dependencies_dev_groups = ["docs"]

[tool.deptry.package_module_name_map]
# Import-name to package-name mappings deptry cannot infer automatically.
"python-dotenv" = ["dotenv"]
"faiss-cpu" = ["faiss"]
"PyStemmer" = ["Stemmer"]
"llama-index-core" = ["llama_index"]
# Docs toolchain (optional_dependencies_dev_groups = ["docs"]): make the
# package->module mapping explicit to suppress deptry's "Assuming the
# corresponding module name" notices.
"sphinx" = ["sphinx"]
"sphinx-autoapi" = ["sphinx_autoapi"]
"pydata-sphinx-theme" = ["pydata_sphinx_theme"]

[tool.deptry.per_rule_ignores]
# litellm (src/agent.py) and workflows (src/pipeline.py) are imported directly
# but provided transitively via llama-index-llms-litellm and llama-index-core
# (which vendors llama-index-workflows). mcp (src/server.py, src/tools/*) is
# imported directly but provided transitively via fastmcp. Ignored under both
# DEP001 and DEP003.
DEP001 = ["litellm", "workflows", "mcp", "mutmut"]
DEP003 = ["litellm", "workflows", "mcp"]

# L3 mutation testing (testing-strategies.md §3.4):
# mutmut audits the oracles themselves — the answer to same-model circularity
# (68% of AI test suites validate bugs instead of catching them). Scope is the
# Tier A/B/C modules; run via `make test-mutations` (manual/nightly gate).
# Caveat (mutmut docs): the mypy-based mutant filter can hide valid mutants —
# the planted-bug garden (tests/verification/gardens/) stays the vacuity
# authority; filter survivor counts are a hint, never a verdict.
[tool.mutmut]
# Mutate the whole src/ tree (mutants/src must be a COMPLETE package for
# imports to resolve during mutmut's pytest runs) and restrict mutation to
# the Tier A/B/C modules via do_not_mutate — everything else is copied
# unmutated (testing-strategies.md §3.4 scope: the critical 5-10%, never the
# tree).
source_paths = ["src/"]
# mutmut executes pytest from mutants/ — the shim (verify/), the scripts
# imported by tests/verification meta-tests, and the real pattern catalogue
# must be present there (copied unmutated). scripts/ is required by
# test_fizz_conformance.py / test_fizz_garden.py / test_mutmut_baseline.py /
# test_garden_bridge.py (`from scripts.… import …` resolves via
# pythonpath="." against the scratch root); a missing copy aborts the stats
# run at collection. pattern/ is required by the LD-4/LD-6 oracles in
# test_loader_properties.py, which pin the REAL catalogue via
# `PatternLoader("pattern")` (CWD-relative); a missing copy fails LD-6
# ("catalogue must not be empty") and silently vacuates LD-4 — observed
# 2026-09-12.
also_copy = ["verify/", "scripts/", "pattern/"]
# In-process shim: mutmut 3.7 asserts trampoline-hit module names never
# start with "src." (an src-LAYOUT convention guard) — this repo's import
# package IS `src`, so the stats run asserts on every legitimate hit. The
# plugin (copied into mutants/ via also_copy) relaxes exactly that assert;
# regular pytest runs never import it.
pytest_add_cli_args = ["-p", "verify.mutmut.mutmut_compat", "--hypothesis-profile=mutmut"]
# Per-mutant wall-clock ceiling: (clean-suite duration + timeout_constant) *
# timeout_multiplier. Upstream defaults (1.0 / 15.0) let a hung mutant burn
# ~16x the clean suite per run; 6x still leaves >50x headroom over the
# per-mutant test runtime (mutmut runs only the tests that touched the
# function) while bounding the nightly budget. Key support verified against
# the 3.7.0 Config dataclass (see Makefile MUTMUT_PIN).
timeout_constant = 5.0
timeout_multiplier = 6.0
# Non-Python dependency policy (keys verified present in the 3.7.0 Config
# dataclass). The gate is a manual/nightly ratchet: mutmut's default "warn"
# KEEPS cached results when a watched non-Python file changes, so a config or
# catalogue edit between two runs would let scripts/mutmut_baseline.py --gate
# distill stale verdicts (observed trap 2026-09-12: a pyproject.toml edit
# between two consecutive `make test-mutations` runs kept the first run's
# results). "rerun" resets all cached results instead. cache_invalidation_files
# additionally pins the pattern catalogue the LD-4/LD-6 oracles read — the
# data-side behaviour of loader.py mutants must re-test when it changes.
on_dependency_change = "rerun"
cache_invalidation_files = ["pattern/*.json"]
# do_not_mutate_patterns is deliberately NOT set: `logger\.`-style exclusions
# are only equivalent-class noise while every mutated module's tests treat log
# lines as unobservable. tests/unit/test_retriever.py asserts on caplog, so
# once src/patterns/retriever.py entered the mutation scope (R5), logger lines
# became observational there — a global pattern filter would delete live
# mutation targets (plan review finding P-02).
do_not_mutate = [
    # Rationale lives in verify/mutmut-scope.md — this list only mirrors it
    # (AGENTS.md L3 rule: any change here must edit a ledger row in the same
    # PR). Group comments name the ledger section holding each entry's row.
    # [Deferred → "Awaiting scope sign-off"]
    "src/config.py",
    "src/reasoning/config.py",
    "src/tools/analyze.py",
    "src/tools/design.py",
    "src/tools/evaluate.py",
    "src/tools/generate.py",
    "src/tools/get_architecture_design_status.py",
    "src/tools/patterns.py",
    # [Deferred → "Model-checked (L4)"]
    "src/pipeline.py",
    # [Permanent → "Permanent (excluded by design)"]
    "src/main.py",
    "src/__main__.py",
    "src/server.py",
    "src/mcp_prompts/*",
    "src/patterns/nodes.py",
    "src/prompts/*",
    "src/reasoning/schemas.py",
    "src/reasoning/__init__.py",
    "src/resources/*",
    "src/schemas/*",
    "src/tools/__init__.py",
]
pytest_add_cli_args_test_selection = [
    "tests/unit/test_text_validation.py",
    "tests/unit/test_text_validation_internals.py",
    "tests/unit/test_normalization.py",
    "tests/unit/test_design_normalization_internals.py",
    "tests/unit/test_validation.py",
    "tests/unit/test_jobs.py",
    "tests/unit/test_config_expansion.py",
    # R5 scope: direct unit oracles for the newly mutated decision modules.
    "tests/unit/test_agent.py",
    "tests/unit/test_reasoning_client.py",
    "tests/unit/test_retriever.py",
    # Scope round 2 (safe-removal audit): each entry is the dedicated kill
    # oracle for a module that left do_not_mutate alongside it.
    "tests/unit/test_pattern_loader.py",        # src/patterns/loader.py
    "tests/unit/test_pattern_embedder.py",      # src/patterns/embedder.py (_normalize)
    "tests/unit/test_reasoning_prompts.py",     # src/reasoning/prompts.py
    "tests/unit/test_adapters.py",              # src/tools/_adapters.py + src/errors.py
    "tests/unit/test_submit_architecture_design.py",  # submit/cancel tool trio
    "tests/verification",
]
