[[mutant]]
id = "FG-32"
spec = "pipeline_control"
status = "expect-fail"
assertion = "P1_AttemptBound"
ops = [
  { kind = "delete_line", find = "require self.attempts < MAX_ATTEMPTS" },
]
timeout_s = 300
note = "FailAttempt bound dropped; attempts exceeds MAX_ATTEMPTS (audit finding: P-1 had no kill mutant)"

[[mutant]]
id = "FG-33"
spec = "pipeline_control"
status = "expect-fail"
assertion = "FP4_TotalOutcome"
ops = [
  { kind = "replace", find = '''        self.outcome = "COMPLETED"''', replace = '''        self.outcome = "STUCK"''' },
]
timeout_s = 300
note = "Finish writes a non-terminal outcome; FP4's terminal-value domain fires (audit finding: FP-4 had no kill mutant)"
