# Production Compose for systemd deployment.
#
# This file is a deployment variant of docker/docker-compose.yml:
#   - No `build:` sections (images must be pre-built from the dev compose
#     via `make docker-build-all` before enabling the service).
#   - Absolute paths everywhere (no ${HOME}, no relative `build.context`).
#   - The systemd unit injects COMPOSE_PROJECT_NAME=apmcp-systemd so this
#     stack is distinct from the dev compose (different project label, no
#     container_name collisions).
#   - TEI sidecars are NOT defined here — they live in the shared
#     `pattern-tei-infra` stack (https://github.com/olk/pattern-tei-infra).  This
#     stack joins the `pattern-tei-shared` external network to reach them by DNS.
#     Prerequisite: `systemctl enable --now pattern-tei-infra.service`.
#
# Installed at: /etc/architecture-pattern-mcp/docker-compose.yml

services:
  architecture-pattern-mcp:
    image: ${MCP_IMAGE:-architecture-pattern-mcp:latest}
    container_name: architecture-pattern-mcp
    networks: [pattern-tei-shared]
    environment:
      - CONFIG_PATH=/app/config/config.json
      - GENERATOR_PROVIDER=minimax
      - GENERATOR_MODEL=minimax/MiniMax-M2.7
      - GENERATOR_BASE_URL=https://api.minimax.io/v1
      - GENERATOR_API_KEY=${MINIMAXAI_API_KEY}
      - GENERATOR_TEMPERATURE=0.1
      - GENERATOR_TOP_P=1.0
      - GENERATOR_TOP_K=20

      - EMBEDDER_PROVIDER=tei
      # TEI sidecars (embedder + reranker) live in the external pattern-tei-infra
      # stack.  TEI capacity tuning (MAX_BATCH_TOKENS, MAX_CONCURRENT_REQUESTS,
      # AUTO_TRUNCATE, etc.) is configured there via the same env-var names used
      # in the Dockerfile.ENV block of the pattern-tei-infra build.
      - EMBEDDER_BASE_URL=http://pattern-tei-embed:8080/v1
      - EMBEDDER_BATCH_SIZE=8
      - EMBEDDER_API_KEY=not-needed

      - PATTERN_DIRECTORY=./pattern

      - RETRIEVAL_BM25_TOP_K=20
      - RETRIEVAL_DENSE_TOP_K=20
      - RETRIEVAL_TOP_K_PATTERNS=5
      - RETRIEVAL_MODE=reciprocal_rerank
      - RETRIEVAL_MIN_FUSION_SCORE=0.015
      - RETRIEVAL_RERANK_SELECTION=rank_fusion
      - RETRIEVAL_RERANK_TOP_N=10
      - RETRIEVAL_USE_LEAN_WIRE_SCHEMA=false
      - RETRIEVAL_STYLE_SCORE_THRESHOLD=50.0
      - RETRIEVAL_ANALYSIS_BLEND_WEIGHT=0.7
      - RETRIEVAL_FUSION_BLEND_WEIGHT=0.3
      - RETRIEVAL_WEIGHT_SMOOTHING_ALPHA=0.7
      - RETRIEVAL_VERBOSE_TIMING=false

      - RERANKER_BASE_URL=http://pattern-tei-rerank:8080
      - RERANKER_TIMEOUT=30

      - TASKS_HEARTBEAT_ENABLED=true
      - TASKS_HEARTBEAT_INTERVAL_SECONDS=30
      - TRANSPORT=streamable-http
      - HOST=0.0.0.0
      - PORT=8050
      - LOGGING_LEVEL=INFO
      - LOGGING_FORMAT=json

    depends_on: []

    ports:
      - "${MCP_HOST_PORT:-8050}:8050"
    volumes:
      - /etc/architecture-pattern-mcp/config:/app/config
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-m", "src.main", "--health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  pattern-tei-shared:
    external: true
